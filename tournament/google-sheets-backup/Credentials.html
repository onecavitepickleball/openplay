<!DOCTYPE html><html><head><base target="_top"><style>body{font:14px Arial,sans-serif;color:#0b2436;padding:18px}h2{margin:0 0 8px}p{color:#637581;line-height:1.5}label{display:block;font-weight:700;margin-top:14px}input{box-sizing:border-box;width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5da;border-radius:7px}button{width:100%;border:0;border-radius:7px;background:#005e89;color:#fff;font-weight:700;padding:12px;margin-top:18px;cursor:pointer}button:disabled{opacity:.55}#status{font-size:12px;margin-top:12px;color:#b33}.note{font-size:11px;background:#edf7fc;padding:10px;border-radius:7px}</style></head><body><h2>Connect Firebase</h2><p>Use an authorized Match Control account.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Authorize and start backup</button><div id="status"></div></form><p class="note">Your password is exchanged for a revocable Firebase refresh token and deleted immediately after setup. Keep this spreadsheet and script restricted to trusted staff.</p><script>document.getElementById('form').onsubmit=function(event){event.preventDefault();var button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Connecting and running the first backup...';google.script.run.withSuccessHandler(function(message){status.style.color='#17713a';status.textContent=message;document.getElementById('password').value='';setTimeout(function(){google.script.host.close()},1600)}).withFailureHandler(function(error){button.disabled=false;status.textContent=error.message||'Setup failed.';document.getElementById('password').value=''}).completeBackupSetup(document.getElementById('email').value,document.getElementById('password').value)};</script></body></html>
