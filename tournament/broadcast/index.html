<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Courts · Matchday</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../field.css?v={{ site.github.build_revision }}"><link rel="stylesheet" href="broadcast.css?v={{ site.github.build_revision }}"></head><body class="live-broadcast">
<header class="broadcast-control" id="broadcastControl"><div class="field-brand"><img src="../../assets/logo-2026.png" alt="Tournament logo"><div><small>Live tournament command</small><b id="eventName">Matchday</b></div></div><nav><button data-broadcast-view="arena" class="active">Arena</button><button data-broadcast-view="focus">Court focus</button><button data-broadcast-view="compact">Score wall</button><select id="focusCourt" aria-label="Focus court"><option value="1">Court 1</option><option value="2">Court 2</option><option value="3">Court 3</option><option value="4">Court 4</option><option value="5">Court 5</option></select><button id="broadcastSound" type="button" aria-pressed="false">Sound: off</button><button id="fullscreenBroadcast">Fullscreen</button><button id="openCast">Open clean cast ↗</button></nav></header>
<main class="broadcast-stage"><section class="broadcast-hero"><div><span class="broadcast-live-dot">LIVE</span><h1>Live Tournament Courts</h1><p id="eventMeta">Connecting to live match data…</p></div><div class="broadcast-clock"><span>Philippine time</span><b id="broadcastClock">--:--:--</b></div></section><section class="broadcast-announcement" id="broadcastAnnouncement" hidden aria-live="polite"></section><section class="broadcast-calls" id="broadcastCalls" aria-label="Now playing court calls"></section><section class="broadcast-pulse" id="broadcastPulse"></section><section class="broadcast-club-standings" id="broadcastClubStandings" aria-label="Live club standings"></section><div class="broadcast-grid modern" id="broadcastGrid"></div><section class="broadcast-ticker"><b>UP NEXT</b><div id="broadcastTicker"></div></section><section class="broadcast-pair-standings" id="broadcastPairStandings" aria-label="Current player standings"></section></main>
<div class="broadcast-gate" id="broadcastGate" hidden><div><h2>Private broadcast</h2><p>Sign in through Match Control on this device first.</p><a href="../control.html">Open Match Control</a></div></div><script>window.addEventListener('error',function(event){if(!/broadcast\.js/.test(event.filename||''))return;var status=document.getElementById('eventMeta');if(status)status.textContent='Broadcast failed to start · '+event.message+' · line '+event.lineno+':'+event.colno;});</script><script type="module" src="broadcast.js?v={{ site.github.build_revision }}"></script></body></html>
