<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Referee App · Matchday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../field.css?v={{ site.github.build_revision }}">
</head>
<body>
  <header class="field-header">
    <div class="field-brand"><img src="../../assets/logo.png" alt="OCPC logo"><div><small>Matchday official</small><b>Referee App</b></div></div>
    <a href="../">Match control</a>
  </header>
  <main class="field-main referee-main">
    <section id="assignmentView">
      <span class="eyebrow">Official scoring</span>
      <h1>Your assigned matches</h1>
      <p class="sub">Sign in using the email assigned by Match Control. Open a match to score every rally live.</p>
      <section class="field-card"><h2>Referee access</h2><div class="field-form referee-login"><input id="officialEmail" type="email" placeholder="Assigned referee email"><input id="officialPassword" type="password" placeholder="Firebase account password"><button class="action" id="officialLogin">Sign in and view assignments</button></div><p class="form-error" id="loginError"></p></section>
      <div class="match-list" id="matchList"></div>
    </section>
    <section id="scorekeeperView" hidden></section>
  </main>
  <div class="official-toast" id="officialToast" role="status"></div>
  <script src="../config.js?v={{ site.github.build_revision }}"></script>
  <script type="module" src="referee.js?v={{ site.github.build_revision }}"></script>
</body>
</html>
