<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Check-In · Matchday</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../field.css"></head><body><header class="field-header"><div class="field-brand"><img src="../../assets/logo.png" alt="OCPC"><div><small>Registration desk</small><b>Player Check-In</b></div></div><a href="../">Match control</a></header><main class="field-main"><span class="eyebrow">Tournament registration</span><h1>Confirm each player</h1><p class="sub">Capture the player photo and confirm waiver, payment, shirt size, club, category, and pair assignment.</p><div class="checkin-grid"><section class="field-card"><h2>Player details</h2><form class="form-grid" id="checkinForm"><label class="full">Player name<input id="playerName" required></label><label>Email<input id="playerEmail" type="email"></label><label>Shirt size<select id="shirtSize"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option></select></label><label>Club<select id="playerClub"><option value="ocpc">OCPC</option><option value="rebels">Rally Rebels</option></select></label><label>Category<select id="playerCategory"></select></label><label>Pair number<select id="pairNumber"></select></label><label>Payment<select id="paymentStatus"><option value="pending">Pending</option><option value="paid">Paid</option><option value="waived">Waived</option></select></label><label class="full">Player photo<input id="playerPhoto" type="file" accept="image/*" capture="user"></label><label class="full"><input id="waiverSigned" type="checkbox"> Hardcopy waiver signed and verified</label><button class="action full" type="submit">Confirm check-in</button></form></section><section class="field-card"><h2>Checked-in players</h2><div id="checkinList"></div></section></div></main><script src="../config.js"></script><script src="checkin.js"></script></body></html>
