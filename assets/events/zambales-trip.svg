<svg viewBox="0 0 800 520" width="800" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE3FF"/>
      <stop offset="100%" stop-color="#F5F3EE"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="520" fill="url(#skyGrad)"/>

  <!-- sun -->
  <circle cx="110" cy="90" r="42" fill="#FFC24B"/>
  <g stroke="#FFC24B" stroke-width="5" stroke-linecap="round">
    <line x1="110" y1="20" x2="110" y2="6"/>
    <line x1="110" y1="160" x2="110" y2="174"/>
    <line x1="40" y1="90" x2="26" y2="90"/>
    <line x1="180" y1="90" x2="194" y2="90"/>
    <line x1="61" y1="41" x2="51" y2="31"/>
    <line x1="159" y1="139" x2="169" y2="149"/>
    <line x1="159" y1="41" x2="169" y2="31"/>
    <line x1="61" y1="139" x2="51" y2="149"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF" stroke="#0B2436" stroke-width="1.5" opacity="0.9">
    <g transform="translate(560,70)">
      <ellipse cx="0" cy="10" rx="34" ry="18"/>
      <ellipse cx="30" cy="4" rx="26" ry="15"/>
      <ellipse cx="-28" cy="6" rx="22" ry="13"/>
    </g>
    <g transform="translate(300,50) scale(0.7)">
      <ellipse cx="0" cy="10" rx="34" ry="18"/>
      <ellipse cx="30" cy="4" rx="26" ry="15"/>
      <ellipse cx="-28" cy="6" rx="22" ry="13"/>
    </g>
  </g>

  <!-- land base -->
  <rect x="0" y="150" width="800" height="370" fill="#EDE9DD"/>

  <!-- ocean corner (Zambales coast) -->
  <path d="M0,150 L340,150 Q230,190 190,230 Q130,270 40,255 Q0,248 0,230 Z" fill="#4FB6FF"/>
  <path d="M0,150 L340,150 Q230,190 190,230 Q130,270 40,255 Q0,248 0,230 Z" fill="none" stroke="#2C93DE" stroke-width="3"/>
  <g stroke="#F5F3EE" stroke-width="3" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M30,190 q20,10 40,0"/>
    <path d="M90,210 q20,10 40,0"/>
    <path d="M150,175 q20,10 40,0"/>
  </g>

  <!-- palm trees near coast -->
  <g transform="translate(75,225)">
    <rect x="-4" y="0" width="8" height="34" rx="3" fill="#0B2436"/>
    <g fill="#2C93DE" stroke="#0B2436" stroke-width="1.5">
      <path d="M0,0 Q-28,-8 -34,-26 Q-8,-18 0,0Z"/>
      <path d="M0,0 Q28,-10 38,-24 Q10,-20 0,0Z"/>
      <path d="M0,0 Q-6,-30 4,-40 Q14,-26 0,0Z"/>
      <path d="M0,0 Q10,-22 30,-6 Q10,-8 0,0Z"/>
    </g>
  </g>
  <g transform="translate(150,248) scale(0.75)">
    <rect x="-4" y="0" width="8" height="34" rx="3" fill="#0B2436"/>
    <g fill="#2C93DE" stroke="#0B2436" stroke-width="1.5">
      <path d="M0,0 Q-28,-8 -34,-26 Q-8,-18 0,0Z"/>
      <path d="M0,0 Q28,-10 38,-24 Q10,-20 0,0Z"/>
      <path d="M0,0 Q-6,-30 4,-40 Q14,-26 0,0Z"/>
      <path d="M0,0 Q10,-22 30,-6 Q10,-8 0,0Z"/>
    </g>
  </g>

  <!-- hills inland from coast -->
  <g fill="#CFE8FF" stroke="#0B2436" stroke-width="2">
    <path d="M170,260 L230,190 L280,260 Z"/>
    <path d="M230,260 L280,205 L330,260 Z"/>
  </g>

  <!-- buildings near Cavite -->
  <g stroke="#0B2436" stroke-width="2">
    <rect x="640" y="360" width="46" height="80" fill="#005E89"/>
    <rect x="692" y="330" width="50" height="110" fill="#0B2436"/>
    <rect x="588" y="385" width="42" height="55" fill="#2C93DE"/>
    <g fill="#F5F3EE" stroke="none">
      <rect x="650" y="372" width="10" height="10"/>
      <rect x="668" y="372" width="10" height="10"/>
      <rect x="650" y="392" width="10" height="10"/>
      <rect x="668" y="392" width="10" height="10"/>
      <rect x="702" y="345" width="10" height="10"/>
      <rect x="722" y="345" width="10" height="10"/>
      <rect x="702" y="365" width="10" height="10"/>
      <rect x="722" y="365" width="10" height="10"/>
      <rect x="702" y="385" width="10" height="10"/>
      <rect x="722" y="385" width="10" height="10"/>
    </g>
  </g>

  <!-- dashed route road -->
  <path d="M660,385 C 520,420 430,300 350,270 C 280,244 250,225 205,205"
        fill="none" stroke="#0B2436" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>

  <!-- Cavite pin -->
  <g transform="translate(668,352)">
    <path d="M0,0 C-22,0 -22,-30 0,-40 C22,-30 22,0 0,0 Z" fill="#005E89" stroke="#0B2436" stroke-width="2"/>
    <circle cx="0" cy="-24" r="9" fill="#F5F3EE"/>
  </g>
  <text x="668" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="17" fill="#0B2436">CAVITE</text>
  <line x1="668" y1="24" x2="668" y2="310" stroke="none"/>

  <!-- Zambales pin -->
  <g transform="translate(196,168)">
    <path d="M0,0 C-22,0 -22,-30 0,-40 C22,-30 22,0 0,0 Z" fill="#2C93DE" stroke="#0B2436" stroke-width="2"/>
    <circle cx="0" cy="-24" r="9" fill="#F5F3EE"/>
  </g>
  <text x="196" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="17" fill="#0B2436">ZAMBALES</text>

  <!-- van -->
  <g transform="translate(430,290) rotate(-18)">
    <!-- shadow -->
    <ellipse cx="0" cy="42" rx="70" ry="9" fill="#0B2436" opacity="0.15"/>
    <!-- body -->
    <rect x="-68" y="-6" width="136" height="46" rx="10" fill="#F5F3EE" stroke="#0B2436" stroke-width="3"/>
    <path d="M-68,-6 L-40,-6 L-30,-32 L20,-32 L34,-6 Z" fill="#F5F3EE" stroke="#0B2436" stroke-width="3"/>
    <!-- windshield -->
    <path d="M-32,-8 L-24,-27 L14,-27 L22,-8 Z" fill="#BFE3FF" stroke="#0B2436" stroke-width="2"/>
    <!-- stripe -->
    <rect x="-68" y="14" width="136" height="10" fill="#4FB6FF"/>
    <!-- door line -->
    <line x1="-6" y1="-6" x2="-6" y2="40" stroke="#0B2436" stroke-width="2"/>
    <!-- OCPC text -->
    <text x="-58" y="10" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="13" fill="#005E89">OCPC</text>
    <!-- paddle+ball icon -->
    <g transform="translate(38,4)">
      <ellipse cx="0" cy="0" rx="10" ry="13" fill="#4FB6FF" stroke="#0B2436" stroke-width="2"/>
      <circle cx="16" cy="-10" r="6" fill="#FF6A4D" stroke="#0B2436" stroke-width="1.5"/>
    </g>
    <!-- wheels -->
    <circle cx="-42" cy="42" r="14" fill="#0B2436"/>
    <circle cx="-42" cy="42" r="5" fill="#8A8F94"/>
    <circle cx="32" cy="42" r="14" fill="#0B2436"/>
    <circle cx="32" cy="42" r="5" fill="#8A8F94"/>
  </g>

  <!-- little motion lines behind van -->
  <g stroke="#0B2436" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="472" y1="330" x2="500" y2="320"/>
    <line x1="480" y1="345" x2="505" y2="337"/>
  </g>
</svg>
