<svg viewBox="0 0 800 520" width="800" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE3FF"/>
      <stop offset="100%" stop-color="#F5F3EE"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="520" fill="url(#skyGrad2)"/>

  <!-- sun -->
  <circle cx="95" cy="66" r="34" fill="#FFC24B"/>
  <g stroke="#FFC24B" stroke-width="5" stroke-linecap="round">
    <line x1="95" y1="4" x2="95" y2="-8"/>
    <line x1="95" y1="128" x2="95" y2="140"/>
    <line x1="33" y1="66" x2="21" y2="66"/>
    <line x1="157" y1="66" x2="169" y2="66"/>
    <line x1="53" y1="24" x2="45" y2="16"/>
    <line x1="137" y1="108" x2="145" y2="116"/>
    <line x1="137" y1="24" x2="145" y2="16"/>
    <line x1="53" y1="108" x2="45" y2="116"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF" stroke="#0B2436" stroke-width="1.5" opacity="0.9">
    <g transform="translate(610,55)">
      <ellipse cx="0" cy="10" rx="34" ry="18"/>
      <ellipse cx="30" cy="4" rx="26" ry="15"/>
      <ellipse cx="-28" cy="6" rx="22" ry="13"/>
    </g>
    <g transform="translate(660,110) scale(0.6)">
      <ellipse cx="0" cy="10" rx="34" ry="18"/>
      <ellipse cx="30" cy="4" rx="26" ry="15"/>
      <ellipse cx="-28" cy="6" rx="22" ry="13"/>
    </g>
  </g>

  <!-- land base -->
  <rect x="0" y="150" width="800" height="370" fill="#EDE9DD"/>

  <!-- Baguio mountains -->
  <g stroke="#0B2436" stroke-width="2">
    <path d="M290,272 L378,213 L462,272 Z" fill="#C9D9D3"/>
    <path d="M335,272 L400,228 L465,272 Z" fill="#B3CBC1"/>
  </g>
  <!-- misty fog over mountains -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="335" cy="245" rx="55" ry="11"/>
  </g>
  <!-- pine trees at mountain base -->
  <g stroke="#0B2436" stroke-width="1.5">
    <g transform="translate(305,266)">
      <rect x="-3" y="14" width="6" height="12" fill="#0B2436" stroke="none"/>
      <path d="M0,-22 L14,4 L-14,4 Z" fill="#2E7D32"/>
      <path d="M0,-10 L12,10 L-12,10 Z" fill="#2E7D32"/>
      <path d="M0,0 L10,16 L-10,16 Z" fill="#2E7D32"/>
    </g>
    <g transform="translate(440,268) scale(0.85)">
      <rect x="-3" y="14" width="6" height="12" fill="#0B2436" stroke="none"/>
      <path d="M0,-22 L14,4 L-14,4 Z" fill="#37944B"/>
      <path d="M0,-10 L12,10 L-12,10 Z" fill="#37944B"/>
      <path d="M0,0 L10,16 L-10,16 Z" fill="#37944B"/>
    </g>
  </g>
  <!-- Baguio pin (Camp John Hay), planted at the summit -->
  <g transform="translate(378,254)">
    <path d="M0,0 C-22,0 -22,-30 0,-40 C22,-30 22,0 0,0 Z" fill="#2E7D32" stroke="#0B2436" stroke-width="2"/>
    <circle cx="0" cy="-24" r="9" fill="#F5F3EE"/>
  </g>
  <text x="378" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#0B2436">CAMP JOHN HAY</text>
  <text x="378" y="197" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#0B2436">BAGUIO</text>

  <!-- La Union coast -->
  <path d="M0,270 L210,270 Q140,292 110,322 Q65,354 0,340 Z" fill="#4FB6FF" stroke="#2C93DE" stroke-width="3"/>
  <g stroke="#F5F3EE" stroke-width="3" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M20,300 q20,10 40,0"/>
    <path d="M80,320 q20,10 40,0"/>
    <path d="M40,282 q20,10 40,0"/>
  </g>
  <!-- palm tree near La Union -->
  <g transform="translate(55,296)">
    <rect x="-4" y="0" width="8" height="30" rx="3" fill="#0B2436"/>
    <g fill="#2C93DE" stroke="#0B2436" stroke-width="1.5">
      <path d="M0,0 Q-26,-8 -32,-24 Q-8,-17 0,0Z"/>
      <path d="M0,0 Q26,-9 36,-22 Q9,-18 0,0Z"/>
      <path d="M0,0 Q-6,-28 4,-37 Q13,-24 0,0Z"/>
      <path d="M0,0 Q9,-20 28,-6 Q9,-7 0,0Z"/>
    </g>
  </g>
  <!-- surfboard leaning -->
  <g transform="translate(105,292) rotate(12)">
    <path d="M0,-42 Q9,-18 0,0 Q-9,-18 0,-42 Z" fill="#FF6A4D" stroke="#0B2436" stroke-width="1.5"/>
    <line x1="0" y1="-36" x2="0" y2="-4" stroke="#F5F3EE" stroke-width="2"/>
  </g>
  <!-- La Union pin -->
  <g transform="translate(150,258)">
    <path d="M0,0 C-22,0 -22,-30 0,-40 C22,-30 22,0 0,0 Z" fill="#2C93DE" stroke="#0B2436" stroke-width="2"/>
    <circle cx="0" cy="-24" r="9" fill="#F5F3EE"/>
  </g>
  <text x="150" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#0B2436">SAN JUAN</text>
  <text x="150" y="197" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#0B2436">LA UNION</text>

  <!-- buildings near Cavite -->
  <g stroke="#0B2436" stroke-width="2">
    <rect x="640" y="360" width="46" height="80" fill="#005E89"/>
    <rect x="692" y="330" width="50" height="110" fill="#0B2436"/>
    <rect x="588" y="385" width="42" height="55" fill="#2C93DE"/>
    <g fill="#F5F3EE" stroke="none">
      <rect x="650" y="372" width="10" height="10"/>
      <rect x="668" y="372" width="10" height="10"/>
      <rect x="650" y="392" width="10" height="10"/>
      <rect x="668" y="392" width="10" height="10"/>
      <rect x="702" y="345" width="10" height="10"/>
      <rect x="722" y="345" width="10" height="10"/>
      <rect x="702" y="365" width="10" height="10"/>
      <rect x="722" y="365" width="10" height="10"/>
      <rect x="702" y="385" width="10" height="10"/>
      <rect x="722" y="385" width="10" height="10"/>
    </g>
  </g>

  <!-- dashed route: Cavite -> La Union -> Baguio -->
  <path d="M655,392 C 540,430 400,380 260,335 C 210,318 178,296 156,272"
        fill="none" stroke="#0B2436" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>
  <path d="M162,262 C 220,300 300,296 358,266"
        fill="none" stroke="#0B2436" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>

  <!-- Cavite pin -->
  <g transform="translate(668,352)">
    <path d="M0,0 C-22,0 -22,-30 0,-40 C22,-30 22,0 0,0 Z" fill="#005E89" stroke="#0B2436" stroke-width="2"/>
    <circle cx="0" cy="-24" r="9" fill="#F5F3EE"/>
  </g>
  <text x="668" y="315" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="17" fill="#0B2436">CAVITE</text>

  <!-- van, on the road between Cavite and La Union -->
  <g transform="translate(500,380) rotate(-10)">
    <ellipse cx="0" cy="42" rx="70" ry="9" fill="#0B2436" opacity="0.15"/>
    <rect x="-68" y="-6" width="136" height="46" rx="10" fill="#F5F3EE" stroke="#0B2436" stroke-width="3"/>
    <path d="M-68,-6 L-40,-6 L-30,-32 L20,-32 L34,-6 Z" fill="#F5F3EE" stroke="#0B2436" stroke-width="3"/>
    <path d="M-32,-8 L-24,-27 L14,-27 L22,-8 Z" fill="#BFE3FF" stroke="#0B2436" stroke-width="2"/>
    <rect x="-68" y="14" width="136" height="10" fill="#4FB6FF"/>
    <line x1="-6" y1="-6" x2="-6" y2="40" stroke="#0B2436" stroke-width="2"/>
    <text x="-58" y="10" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="13" fill="#005E89">OCPC</text>
    <g transform="translate(38,4)">
      <ellipse cx="0" cy="0" rx="10" ry="13" fill="#4FB6FF" stroke="#0B2436" stroke-width="2"/>
      <circle cx="16" cy="-10" r="6" fill="#FF6A4D" stroke="#0B2436" stroke-width="1.5"/>
    </g>
    <circle cx="-42" cy="42" r="14" fill="#0B2436"/>
    <circle cx="-42" cy="42" r="5" fill="#8A8F94"/>
    <circle cx="32" cy="42" r="14" fill="#0B2436"/>
    <circle cx="32" cy="42" r="5" fill="#8A8F94"/>
  </g>

  <!-- motion lines behind van -->
  <g stroke="#0B2436" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="552" y1="408" x2="580" y2="398"/>
    <line x1="560" y1="424" x2="585" y2="416"/>
  </g>
</svg>
